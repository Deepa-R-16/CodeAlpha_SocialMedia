<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — SocialApp</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg,#667eea,#764ba2); padding: 20px;
    }
    .box {
      background: #fff; border-radius: 20px; padding: 44px 36px;
      width: 100%; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    h2 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    p  { font-size: 14px; color: #888; margin-bottom: 24px; line-height: 1.6; }
    form { display: flex; flex-direction: column; gap: 14px; }
    input {
      padding: 13px 15px; border: 1.5px solid #e8e8e8; border-radius: 10px;
      font-size: 14px; font-family: inherit; outline: none; transition: border-color .2s;
    }
    input:focus { border-color: #667eea; }
    .btn {
      padding: 13px; background: linear-gradient(135deg,#667eea,#764ba2);
      color: white; border: none; border-radius: 10px; font-size: 15px;
      font-weight: 700; cursor: pointer; font-family: inherit;
    }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .err { background: #fef2f2; border: 1px solid #fca5a5; border-radius: 8px;
           padding: 11px 13px; font-size: 13px; color: #b91c1c; display: none; }
    .ok  { background: #f0fdf4; border: 1px solid #86efac; border-radius: 8px;
           padding: 11px 13px; font-size: 13px; color: #15803d; display: none; }
  </style>
</head>
<body>
<div class="box">
  <h2>🔐 Set New Password</h2>
  <p>Enter your new password below. Make it at least 6 characters.</p>
  <div class="err" id="err"></div>
  <div class="ok"  id="ok"></div>
  <form id="reset-form">
    <input type="password" name="password"  placeholder="New password" required minlength="6">
    <input type="password" name="password2" placeholder="Confirm new password" required>
    <button type="submit" class="btn" id="reset-btn">Set New Password</button>
  </form>
</div>

<script type="module">
import { resetPassword } from '../js/api.js';

// Get token and uid from URL: ?uid=X&token=XXXX
const params = new URLSearchParams(window.location.search);
const uid    = params.get('uid');
const token  = params.get('token');

if (!uid || !token) {
    document.getElementById('err').textContent = 'Invalid reset link. Please request a new one.';
    document.getElementById('err').style.display = 'block';
    document.getElementById('reset-form').style.display = 'none';
}

document.getElementById('reset-form').addEventListener('submit', async e => {
    e.preventDefault();
    const pw1 = e.target.password.value;
    const pw2 = e.target.password2.value;
    const err = document.getElementById('err');
    const ok  = document.getElementById('ok');

    if (pw1 !== pw2) {
        err.textContent = 'Passwords do not match.';
        err.style.display = 'block';
        return;
    }

    const btn = document.getElementById('reset-btn');
    btn.disabled = true;
    btn.textContent = 'Saving...';

    const data = await resetPassword({ uid, token, password: pw1 });

    if (data?.__error || data?.error) {
        err.textContent = data.error || data.detail || 'Reset failed. Link may have expired.';
        err.style.display = 'block';
        ok.style.display  = 'none';
    } else {
        ok.textContent = '✅ Password updated! Redirecting to login...';
        ok.style.display  = 'block';
        err.style.display = 'none';
        setTimeout(() => window.location.href = 'index.html', 2000);
    }

    btn.disabled = false;
    btn.textContent = 'Set New Password';
});
</script>
</body>
</html>
