<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages — SocialApp</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           background: #fafafa; color: #1a1a1a; height: 100vh; display: flex; flex-direction: column; }

    .nav { background: #fff; border-bottom: 1px solid #efefef; height: 56px;
           display: flex; align-items: center; padding: 0 24px; gap: 4px;
           position: sticky; top: 0; z-index: 100; flex-shrink: 0; }
    .nav-logo { font-size: 22px; font-weight: 800; color: #667eea;
                text-decoration: none; margin-right: 12px; }
    .nav a { text-decoration: none; color: #444; font-size: 14px; font-weight: 500;
             padding: 7px 11px; border-radius: 8px; }
    .nav a:hover { background: #f5f5f5; }
    .nav-logout { margin-left: auto; padding: 7px 14px; background: none;
                  border: 1px solid #ddd; border-radius: 8px; font-size: 13px; cursor: pointer; }

    .chat-layout { display: flex; flex: 1; overflow: hidden; max-width: 960px;
                   width: 100%; margin: 0 auto; }

    /* Sidebar — conversation list */
    .conv-list { width: 320px; border-right: 1px solid #efefef; background: #fff;
                 display: flex; flex-direction: column; flex-shrink: 0; }
    .conv-header { padding: 16px 20px; border-bottom: 1px solid #efefef;
                   display: flex; align-items: center; justify-content: space-between; }
    .conv-header h2 { font-size: 16px; font-weight: 700; }
    .new-msg-btn { padding: 6px 14px; background: #667eea; color: #fff;
                   border: none; border-radius: 6px; font-size: 13px;
                   font-weight: 600; cursor: pointer; }

    .conv-search { padding: 10px 16px; border-bottom: 1px solid #f5f5f5; }
    .conv-search input { width: 100%; padding: 9px 12px; border: 1px solid #e8e8e8;
                         border-radius: 20px; font-size: 13px; font-family: inherit;
                         outline: none; background: #f8f8f8; }

    .conv-items { overflow-y: auto; flex: 1; }
    .conv-item { display: flex; align-items: center; gap: 12px; padding: 14px 16px;
                 cursor: pointer; border-bottom: 1px solid #fafafa; transition: background .15s; }
    .conv-item:hover, .conv-item.active { background: #f5f3ff; }
    .conv-av { width: 46px; height: 46px; border-radius: 50%; background: #667eea;
               display: flex; align-items: center; justify-content: center;
               color: #fff; font-weight: 700; font-size: 17px; flex-shrink: 0; }
    .conv-av img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .conv-info { flex: 1; min-width: 0; }
    .conv-info .uname { font-weight: 600; font-size: 14px; }
    .conv-info .preview { font-size: 12px; color: #888; white-space: nowrap;
                          overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .conv-time { font-size: 11px; color: #bbb; white-space: nowrap; }
    .unread-dot { width: 8px; height: 8px; border-radius: 50%;
                  background: #667eea; flex-shrink: 0; }

    /* Main chat area */
    .chat-main { flex: 1; display: flex; flex-direction: column; background: #fff;
                 min-width: 0; }

    .chat-header { padding: 14px 20px; border-bottom: 1px solid #efefef;
                   display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .chat-header .conv-av { width: 38px; height: 38px; font-size: 14px; }
    .chat-header h3 { font-size: 15px; font-weight: 700; }
    .chat-header span { font-size: 12px; color: #888; }

    .messages { flex: 1; overflow-y: auto; padding: 16px 20px;
                display: flex; flex-direction: column; gap: 10px; }

    .msg { max-width: 68%; display: flex; flex-direction: column; }
    .msg.mine { align-self: flex-end; align-items: flex-end; }
    .msg.theirs { align-self: flex-start; align-items: flex-start; }

    .msg-bubble { padding: 10px 14px; border-radius: 18px; font-size: 14px;
                  line-height: 1.5; word-break: break-word; }
    .msg.mine   .msg-bubble { background: #667eea; color: #fff;
                               border-bottom-right-radius: 4px; }
    .msg.theirs .msg-bubble { background: #f0f0f0; color: #1a1a1a;
                               border-bottom-left-radius: 4px; }
    .msg-time { font-size: 11px; color: #bbb; margin-top: 3px; padding: 0 4px; }

    .no-chat { flex: 1; display: flex; flex-direction: column; align-items: center;
               justify-content: center; color: #aaa; }
    .no-chat div { font-size: 48px; margin-bottom: 12px; }
    .no-chat p { font-size: 14px; }

    .chat-input { padding: 12px 16px; border-top: 1px solid #efefef;
                  display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
    .chat-input input { flex: 1; padding: 11px 16px; border: 1.5px solid #e8e8e8;
                        border-radius: 22px; font-size: 14px; font-family: inherit;
                        outline: none; }
    .chat-input input:focus { border-color: #667eea; }
    .chat-input button { padding: 11px 20px; background: #667eea; color: #fff;
                         border: none; border-radius: 22px; font-weight: 600;
                         font-size: 14px; cursor: pointer; }

    /* New message modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5);
                     z-index: 500; display: none; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: #fff; border-radius: 16px; padding: 24px;
             width: min(400px, 90vw); }
    .modal h3 { font-size: 16px; font-weight: 700; margin-bottom: 14px; }
    .modal input { width: 100%; padding: 11px 14px; border: 1.5px solid #e8e8e8;
                   border-radius: 8px; font-size: 14px; font-family: inherit;
                   outline: none; margin-bottom: 12px; }
    .modal input:focus { border-color: #667eea; }
    .modal-users { max-height: 200px; overflow-y: auto; margin-bottom: 14px; }
    .modal-user { display: flex; align-items: center; gap: 10px; padding: 10px;
                  cursor: pointer; border-radius: 8px; transition: background .15s; }
    .modal-user:hover { background: #f5f3ff; }
    .modal-user .conv-av { width: 36px; height: 36px; font-size: 13px; }
    .modal-user span { font-size: 14px; font-weight: 500; }
    .modal-btns { display: flex; gap: 10px; }
    .modal-btns button { flex: 1; padding: 10px; border-radius: 8px; font-size: 14px;
                         font-weight: 600; cursor: pointer; font-family: inherit; }
    .btn-cancel { background: #f5f5f5; border: none; color: #555; }
    .btn-start  { background: #667eea; border: none; color: #fff; }

    @media(max-width: 600px) {
      .conv-list { width: 80px; }
      .conv-info, .conv-time, .unread-dot { display: none; }
      .conv-search, .conv-header h2, .new-msg-btn { display: none; }
      .conv-item { padding: 10px; justify-content: center; }
    }
  </style>
</head>
<body>

<nav class="nav">
  <a class="nav-logo" href="feed.html">● SocialApp</a>
  <a href="feed.html">🏠</a>
  <a href="explore.html">🔍</a>
  <a href="reels.html">🎬</a>
  <a href="upload.html">➕</a>
  <a href="chat.html">💬</a>
  <a href="profile.html">👤</a>
  <button class="nav-logout" onclick="localStorage.clear();window.location.href='index.html'">Logout</button>
</nav>

<div class="chat-layout">
  <!-- Conversations sidebar -->
  <div class="conv-list">
    <div class="conv-header">
      <h2>Messages</h2>
      <button class="new-msg-btn" onclick="openNewMsg()">✏️ New</button>
    </div>
    <div class="conv-search">
      <input type="text" placeholder="Search messages..." id="msg-search"
             oninput="filterConvs(this.value)">
    </div>
    <div class="conv-items" id="conv-items">
      <div style="text-align:center;padding:30px;color:#aaa;font-size:13px">
        No messages yet.<br>Start a conversation!
      </div>
    </div>
  </div>

  <!-- Chat area -->
  <div class="chat-main" id="chat-main">
    <div class="no-chat">
      <div>💬</div>
      <p>Select a conversation or start a new one</p>
    </div>
  </div>
</div>

<!-- New message modal -->
<div class="modal-overlay" id="new-msg-modal">
  <div class="modal">
    <h3>New Message</h3>
    <input type="text" id="user-search-inp" placeholder="Search for a user..."
           oninput="searchForUser(this.value)">
    <div class="modal-users" id="modal-user-list">
      <div style="color:#aaa;font-size:13px;text-align:center">Type a username to search</div>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeNewMsg()">Cancel</button>
    </div>
  </div>
</div>

<script type="module">
import { searchUsers, getSuggestedUsers } from '../js/api.js';

if (!localStorage.getItem('access_token')) {
  window.location.href = 'index.html';
}

const myId       = localStorage.getItem('user_id');
const myUsername = localStorage.getItem('username') || 'Me';

// Load conversations from localStorage (client-side DMs for now)
let conversations = JSON.parse(localStorage.getItem('dm_convs') || '[]');
let activeConv    = null;

function saveConvs() {
  localStorage.setItem('dm_convs', JSON.stringify(conversations));
}

function renderConvList() {
  const el = document.getElementById('conv-items');
  if (!conversations.length) {
    el.innerHTML = `<div style="text-align:center;padding:30px;color:#aaa;font-size:13px">
      No messages yet.<br>Start a conversation!
    </div>`;
    return;
  }
  el.innerHTML = conversations.map(c => {
    const last = c.messages[c.messages.length - 1];
    const letter = c.username[0].toUpperCase();
    return `<div class="conv-item ${activeConv?.id === c.id ? 'active' : ''}"
                 onclick="openConv('${c.id}')">
      <div class="conv-av">${letter}</div>
      <div class="conv-info">
        <div class="uname">${c.username}</div>
        <div class="preview">${last ? last.text : 'No messages yet'}</div>
      </div>
      <span class="conv-time">${last ? timeAgo(last.ts) : ''}</span>
    </div>`;
  }).join('');
}

function openConv(id) {
  activeConv = conversations.find(c => c.id === id);
  if (!activeConv) return;
  renderConvList();

  const main = document.getElementById('chat-main');
  const letter = activeConv.username[0].toUpperCase();
  main.innerHTML = `
    <div class="chat-header">
      <div class="conv-av">${letter}</div>
      <div>
        <h3>${activeConv.username}</h3>
        <span>Active recently</span>
      </div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="chat-input">
      <input type="text" id="msg-inp" placeholder="Message ${activeConv.username}..."
             onkeydown="if(event.key==='Enter') sendMsg()">
      <button onclick="sendMsg()">Send</button>
    </div>`;

  renderMessages();
  document.getElementById('msg-inp').focus();
}

function renderMessages() {
  if (!activeConv) return;
  const el = document.getElementById('messages');
  if (!el) return;
  el.innerHTML = activeConv.messages.map(m => `
    <div class="msg ${m.from === myUsername ? 'mine' : 'theirs'}">
      <div class="msg-bubble">${m.text}</div>
      <div class="msg-time">${timeAgo(m.ts)}</div>
    </div>`).join('');
  el.scrollTop = el.scrollHeight;
}

window.sendMsg = () => {
  const inp = document.getElementById('msg-inp');
  const txt = inp.value.trim();
  if (!txt || !activeConv) return;
  inp.value = '';

  activeConv.messages.push({
    from: myUsername,
    text: txt,
    ts:   Date.now()
  });

  // Move conversation to top
  conversations = [
    activeConv,
    ...conversations.filter(c => c.id !== activeConv.id)
  ];
  saveConvs();
  renderConvList();
  renderMessages();
};

window.openNewMsg = () => {
  document.getElementById('new-msg-modal').classList.add('open');
  loadSuggested();
};

window.closeNewMsg = () => {
  document.getElementById('new-msg-modal').classList.remove('open');
  document.getElementById('user-search-inp').value = '';
};

async function loadSuggested() {
  const users = await getSuggestedUsers();
  renderModalUsers(users || []);
}

window.searchForUser = async (q) => {
  if (!q.trim()) { loadSuggested(); return; }
  const users = await searchUsers(q);
  renderModalUsers(users || []);
};

function renderModalUsers(users) {
  const el = document.getElementById('modal-user-list');
  if (!users.length) {
    el.innerHTML = '<div style="color:#aaa;font-size:13px;text-align:center">No users found</div>';
    return;
  }
  el.innerHTML = users.map(u => `
    <div class="modal-user" onclick="startConv(${u.id}, '${u.username}')">
      <div class="conv-av" style="width:36px;height:36px;font-size:13px">
        ${u.username[0].toUpperCase()}
      </div>
      <span>${u.username}</span>
    </div>`).join('');
}

window.startConv = (userId, username) => {
  closeNewMsg();
  const existing = conversations.find(c => c.userId === userId);
  if (existing) {
    openConv(existing.id);
    return;
  }
  const newConv = {
    id:       `conv_${userId}_${Date.now()}`,
    userId,
    username,
    messages: []
  };
  conversations.unshift(newConv);
  saveConvs();
  renderConvList();
  openConv(newConv.id);
};

window.filterConvs = (q) => {
  document.querySelectorAll('.conv-item').forEach(el => {
    const name = el.querySelector('.uname')?.textContent || '';
    el.style.display = name.toLowerCase().includes(q.toLowerCase()) ? '' : 'none';
  });
};

function timeAgo(ts) {
  const m = Math.floor((Date.now() - ts) / 60000);
  if (m < 1) return 'now';
  if (m < 60) return m + 'm';
  if (m < 1440) return Math.floor(m/60) + 'h';
  return Math.floor(m/1440) + 'd';
}

renderConvList();
</script>
</body>
</html>
