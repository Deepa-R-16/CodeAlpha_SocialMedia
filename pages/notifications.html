<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications — SocialApp</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, sans-serif; background: #fafafa; }
    .nav { background: #fff; border-bottom: 1px solid #efefef; height: 56px;
           display: flex; align-items: center; padding: 0 24px; gap: 4px;
           position: sticky; top: 0; z-index: 100; }
    .nav-logo { font-size: 22px; font-weight: 800; color: #667eea; text-decoration: none; margin-right: 12px; }
    .nav a { text-decoration: none; color: #444; font-size: 14px; font-weight: 500; padding: 7px 11px; border-radius: 8px; }
    .nav a:hover { background: #f5f5f5; }
    .nav-logout { margin-left: auto; padding: 7px 14px; background: none; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; cursor: pointer; }

    .wrap { max-width: 600px; margin: 24px auto; padding: 0 16px; }
    .wrap h2 { font-size: 18px; font-weight: 700; margin-bottom: 16px; }

    .notif { display: flex; align-items: center; gap: 12px; padding: 14px 16px;
             background: #fff; border: 1px solid #efefef; border-radius: 12px;
             margin-bottom: 8px; transition: background .15s; }
    .notif.unread { background: #f5f3ff; border-color: #e0d9ff; }
    .notif-av { width: 42px; height: 42px; border-radius: 50%; background: #667eea;
                display: flex; align-items: center; justify-content: center;
                color: #fff; font-weight: 700; font-size: 16px; flex-shrink: 0; }
    .notif-body { flex: 1; font-size: 14px; line-height: 1.5; }
    .notif-body b { font-weight: 600; }
    .notif-time { font-size: 12px; color: #aaa; white-space: nowrap; }
    .notif-icon { font-size: 20px; flex-shrink: 0; }

    .empty { text-align: center; padding: 60px 20px; color: #aaa; }
    .empty div { font-size: 48px; margin-bottom: 12px; }
  </style>
</head>
<body>
<nav class="nav">
  <a class="nav-logo" href="feed.html">● SocialApp</a>
  <a href="feed.html">🏠 Home</a>
  <a href="explore.html">🔍</a>
  <a href="reels.html">🎬</a>
  <a href="upload.html">➕</a>
  <a href="chat.html">💬</a>
  <a href="profile.html">👤</a>
  <button class="nav-logout" onclick="localStorage.clear();window.location.href='index.html'">Logout</button>
</nav>

<div class="wrap">
  <h2>🔔 Notifications</h2>
  <div id="notif-list"><div style="text-align:center;padding:20px;color:#aaa">Loading...</div></div>
</div>

<script type="module">
const BASE  = 'http://127.0.0.1:8000/api';
const token = localStorage.getItem('access_token');
if (!token) window.location.href = 'index.html';

const ICONS = { like: '❤️', comment: '💬', follow: '👤', story: '👁️' };
const TEXTS = {
  like:    'liked your post',
  comment: 'commented on your post',
  follow:  'started following you',
  story:   'viewed your story',
};

function timeAgo(d) {
  const m = Math.floor((Date.now() - new Date(d)) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  if (m < 1440) return Math.floor(m/60) + 'h ago';
  return Math.floor(m/1440) + 'd ago';
}

async function load() {
  const res  = await fetch(`${BASE}/notifications/`, {
    headers: { Authorization: `Bearer ${token}` }
  });
  const data = await res.json();
  const el   = document.getElementById('notif-list');

  if (!data.length) {
    el.innerHTML = `<div class="empty"><div>🔔</div><p>No notifications yet</p></div>`;
    return;
  }

  el.innerHTML = data.map(n => `
    <div class="notif ${n.is_read ? '' : 'unread'}">
      <div class="notif-av">${(n.sender?.username||'U')[0].toUpperCase()}</div>
      <div class="notif-body">
        <b>${n.sender?.username}</b> ${TEXTS[n.type] || n.type}
      </div>
      <span class="notif-time">${timeAgo(n.created_at)}</span>
      <span class="notif-icon">${ICONS[n.type] || '🔔'}</span>
    </div>`).join('');

  // Mark all as read
  await fetch(`${BASE}/notifications/read/`, {
    method: 'POST',
    headers: { Authorization: `Bearer ${token}` }
  });
}

load();
</script>
</body>
</html>
